<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiz TKM - Janly Futbol Analizleri</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        .match-card { background-color: #1e1e1e; border-radius: 8px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #00e676; }
        .teams { font-weight: bold; font-size: 1.1em; }
        .score { color: #00e676; float: right; }
    </style>
</head>
<body>

    <h1>Janly Futbol Matçlary We Çaklamalar</h1>
    <div id="matches-list">Maglumatlar ýüklenýär...</div>

    <script>
        const apiKey = '7feb70cfe2msh7665803609e923fp134924jsncb7da24b9df4';
        const apiHost = 'sportapi7.p.rapidapi.com';

        async function getLiveMatches() {
            const url = 'https://sportapi7.p.rapidapi.com/api/v1/sport/football/events/live';
            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': apiKey,
                    'x-rapidapi-host': apiHost
                }
            };

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                
                const container = document.getElementById('matches-list');
                container.innerHTML = '';

                if (data.events && data.events.length > 0) {
                    data.events.forEach(event => {
                        const homeTeam = event.homeTeam.name;
                        const awayTeam = event.awayTeam.name;
                        const homeScore = event.homeScore.current || 0;
                        const awayScore = event.awayScore.current || 0;

                        container.innerHTML += `
                            <div class="match-card">
                                <span class="teams">${homeTeam} vs ${awayTeam}</span>
                                <span class="score">${homeScore} - ${awayScore}</span>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p>Şu wagt janly geçirilýän matç ýok.</p>';
                }
            } catch (error) {
                console.error('Yalňyşlyk:', error);
                document.getElementById('matches-list').innerText = 'Maglumatlary altyrmakda ýalňyşlyk ýüze çykdy.';
            }
        }

        // Saýt açylanda matçlary çekýär
        getLiveMatches();
    </script>

</body>
</html>
