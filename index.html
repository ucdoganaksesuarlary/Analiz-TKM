<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiz TKM - AI Futbol Analizleri</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 15px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.2rem; margin: 0; color: #00e676; }
        .refresh-btn { background: #00e676; color: #000; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .match-card { background-color: #1e1e1e; border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 5px solid #00e676; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .teams { font-weight: bold; font-size: 1rem; display: flex; justify-content: space-between; }
        .score { color: #00e676; font-size: 1.1rem; }
        .ai-analysis { margin-top: 10px; padding-top: 8px; border-top: 1px solid #333; font-size: 0.85rem; color: #b0bec5; }
        .badge { background: #263238; color: #80d8ff; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Analiz-TKM (Janly AI)</h1>
        <button class="refresh-btn" onclick="getLiveMatches()">Täzele 🔄</button>
    </div>

    <div id="matches-list">Matçlar we AI analizleri ýüklenýär...</div>

    <script>
        const apiKey = '7feb70cfe2msh7665803609e923fp134924jsncb7da24b9df4';
        const apiHost = 'sportapi7.p.rapidapi.com';

        // Algoritmiki AI Analiz Generatory
        function generateAIAnalysis(homeScore, awayScore) {
            const totalGoals = homeScore + awayScore;
            let prediction = "";
            let confidence = "";

            if (totalGoals >= 3) {
                prediction = "Köplenç hüjümçi oýun: Ýene 1 gol bolmak ähtimallygy ýokary (Over 3.5/4.5)";
                confidence = "85%";
            } else if (totalGoals === 0) {
                prediction = "Ätiýaçly oýun: 2-nji ýarymda T.O 0.5 köp ýa-da Garşylykly gol (GG)";
                confidence = "70%";
            } else if (homeScore > awayScore) {
                prediction = "Meydan eýesi bökdençsiz gözegçilik edýär: Ýeňiş (P1) ýa-da Indiki Gol (Meydan eýesi)";
                confidence = "78%";
            } else {
                prediction = "Miçewsa hüjümli oýun: 1.5 Gol Köp (Over 1.5) Ähtimallygy Barlygy";
                confidence = "80%";
            }

            return { prediction, confidence };
        }

        async function getLiveMatches() {
            const container = document.getElementById('matches-list');
            const url = 'https://sportapi7.p.rapidapi.com/api/v1/sport/football/events/live';
            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': apiKey,
                    'x-rapidapi-host': apiHost
                }
            };

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                
                container.innerHTML = '';

                if (data.events && data.events.length > 0) {
                    data.events.forEach(event => {
                        const homeTeam = event.homeTeam.name;
                        const awayTeam = event.awayTeam.name;
                        const homeScore = event.homeScore.current || 0;
                        const awayScore = event.awayScore.current || 0;

                        const ai = generateAIAnalysis(homeScore, awayScore);

                        container.innerHTML += `
                            <div class="match-card">
                                <div class="teams">
                                    <span>${homeTeam} vs ${awayTeam}</span>
                                    <span class="score">${homeScore} - ${awayScore}</span>
                                </div>
                                <div class="ai-analysis">
                                    🤖 <b>AI Analiz:</b> ${ai.prediction} <br>
                                    🎯 <b>Ynamlylyk:</b> <span class="badge">${ai.confidence}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p>Şu wagt janly geçirilýän matç ýok.</p>';
                }
            } catch (error) {
                console.error('Ýalňyşlyk:', error);
                container.innerText = 'Maglumatlary almakda ýalňyşlyk ýüze çykdy.';
            }
        }

        // Saýt açylanda ilkinji gezek matçlary çekýär
        getLiveMatches();

        // Her 5 minutdan (300,000 ms) awtomatiki täzeleýär (Limit sarp etmezlik üçin)
        setInterval(getLiveMatches, 300000);
    </script>

</body>
</html>
